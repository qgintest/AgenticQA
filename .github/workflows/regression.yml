name: Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deliberate_failure:
        description: Also run the deliberately failing scenario (job will fail on purpose)
        type: choice
        options: ['off', 'assertion', 'locator']
        default: 'off'

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Playwright regression (Medusa AUT)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      # Only used on aqa-heal/* branches: runs started by the heal-pr job (workflow_dispatch) do not
      # show on the pull request, so the result is published as a commit status that does.
      statuses: write
    outputs:
      # Consumed by the heal-pr job; only "validated" leads to a pull request.
      heal_status: ${{ steps.heal_validate.outputs.status }}
      heal_branch: ${{ github.head_ref || github.ref_name }}
      heal_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    env:
      CI: 'true'
      AQA_DELIBERATE_FAILURE: ${{ inputs.deliberate_failure || 'off' }}
      AQA_RUN_ID: gh${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the triage step can diff this push or PR against its base.
          fetch-depth: 0

      - name: Report pending status on the self-heal PR
        if: ${{ startsWith(github.ref_name, 'aqa-heal/') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api -X POST "repos/$REPO/statuses/$SHA"
          -f state=pending -f context="Playwright regression (Medusa AUT)"
          -f description="Regression run in progress" -f target_url="$RUN_URL" --silent

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            automation/package-lock.json
            agents/failure-triage/package-lock.json

      # ---------- Medusa test environment (same compose stack and scripts as local dev) ----------

      - name: Create AUT env files (random secrets per run)
        working-directory: aut
        run: sh scripts/init-env.sh

      - name: Build AUT image
        working-directory: aut
        run: docker compose build medusa

      - name: Start Postgres, Redis and Medusa (migrations + seed run on start)
        working-directory: aut
        run: docker compose up -d --wait --wait-timeout 600 postgres redis medusa

      - name: Create admin user and wire publishable key
        working-directory: aut
        run: |
          sh scripts/create-admin.sh
          sh scripts/get-publishable-key.sh

      - name: Start storefront
        working-directory: aut
        run: |
          docker compose up -d storefront
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 http://localhost:8000/dk || true)
            [ "$code" = "200" ] && echo "storefront ready" && exit 0
            sleep 5
          done
          echo "storefront did not become ready" >&2
          docker compose logs --no-color storefront | tail -100
          exit 1

      # ---------- Test suite ----------

      - name: Install test dependencies
        working-directory: automation
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('automation/package-lock.json') }}

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: automation
        run: npm run typecheck

      - name: Run regression suite
        id: regression
        working-directory: automation
        # Admin credentials come from aut/.env (generated above); no repository secrets needed.
        # This step's exit code alone decides the job result; nothing after it can turn a failure green.
        run: npx playwright test

      # ---------- Diagnostics (kept for every run; failure artifacts only when something failed) ----------

      - name: Job summary
        if: always()
        working-directory: automation
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Collect AUT logs and state
        if: always()
        working-directory: aut
        run: |
          mkdir -p ../automation/reports/aut
          docker compose ps -a > ../automation/reports/aut/compose-ps.txt 2>&1 || true
          for s in medusa storefront postgres redis; do
            docker compose logs --no-color --timestamps "$s" > "../automation/reports/aut/$s.log" 2>&1 || true
          done

      # ---------- AI failure triage (only when the regression suite failed; advisory, read-only) ----------

      - name: Summarize code changes for triage
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' }}
        continue-on-error: true
        # The agent never runs git: this step writes the diff to reports/, where the agent reads it
        # through its sandbox like any other (untrusted, redacted) artifact. Event values come in via
        # env, never interpolated into the script.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          out=automation/reports/changes.diff
          full="$RUNNER_TEMP/changes-full.diff"
          head=$(git rev-parse HEAD)
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA"; label="pull request base" ;;
            push) base="$PUSH_BEFORE"; label="previous push" ;;
            *) base=""; label="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)
            label="merge base with $DEFAULT_BRANCH"
          fi
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || true)
            label="parent commit"
          fi
          if [ -z "$base" ]; then
            echo "no base commit to compare with; skipping change summary"
            exit 0
          fi
          base=$(git merge-base "$base" HEAD)
          git diff --no-color --no-ext-diff --unified=3 -M "$base" HEAD -- . ':(exclude)*package-lock.json' > "$full"
          {
            echo "# base: $label $base"
            echo "# head: $head"
            echo "# files:"
            git diff --no-color --name-status -M "$base" HEAD | sed 's/^/# /'
            # The agent reads at most 1 MiB of this file; cut here too so the artifact stays small.
            head -c 1048576 "$full"
          } > "$out"
          echo "change summary: $(grep -c '^# [AMDRCT]' "$out" || true) files changed since $label ${base:0:12}"

      - name: Build failure-triage agent
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' }}
        continue-on-error: true
        working-directory: agents/failure-triage
        run: |
          npm ci
          npm run build

      - name: Triage failures
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' }}
        # A triage problem must never hide or replace the regression failure: the job already failed
        # at the regression step, and this step cannot change that either way.
        continue-on-error: true
        timeout-minutes: 10
        working-directory: agents/failure-triage
        env:
          # Only this step sees the key. Without it (e.g. PRs from forks) triage falls back to heuristics.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
        run: >-
          node dist/src/cli.js
          --reports ../../automation/reports
          --test-results ../../automation/test-results
          --out ../../automation/reports/triage

      - name: Upload triage report
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: failure-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation/reports/triage/
          retention-days: 14
          if-no-files-found: warn

      # ---------- AI self-heal (AI-classified locator defects only; validates, never pushes) ----------

      - name: Self-heal - propose locator repair
        id: heal_propose
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' }}
        # Advisory like triage: cannot change the regression result in either direction.
        continue-on-error: true
        timeout-minutes: 8
        working-directory: agents/failure-triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          # Event values come in via env, never interpolated into the script.
          HEAL_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node dist/src/heal/cli.js propose --repo-root ../.. --out ../../automation/reports/heal

      - name: Self-heal - validate repair in an isolated worktree
        id: heal_validate
        # Runs before teardown: same AUT containers, build and browser as the failed run.
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' && steps.heal_propose.outputs.status == 'proposed' }}
        continue-on-error: true
        timeout-minutes: 30
        working-directory: agents/failure-triage
        env:
          HEAL_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node dist/src/heal/cli.js validate --repo-root ../.. --out ../../automation/reports/heal

      - name: Upload self-heal result
        if: ${{ !cancelled() && steps.regression.outcome == 'failure' && hashFiles('automation/reports/heal/heal-result.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: self-heal-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation/reports/heal/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload reports (HTML, JSON, JUnit, environment, AUT logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure artifacts (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down AUT
        if: always()
        working-directory: aut
        run: docker compose down -v --remove-orphans

      - name: Report final status on the self-heal PR
        if: ${{ always() && startsWith(github.ref_name, 'aqa-heal/') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.regression.outcome }}
        run: |
          case "$OUTCOME" in
            success) state=success; desc="Regression suite passed on the repaired commit" ;;
            failure) state=failure; desc="Regression suite failed on the repaired commit" ;;
            *) state=error; desc="Regression suite did not run (setup failed or the run was cancelled)" ;;
          esac
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="Playwright regression (Medusa AUT)" \
            -f description="$desc" -f target_url="$RUN_URL" --silent
          echo "Commit status on $SHA: $state"

  # Opens a pull request (ready for review) for a validated locator repair and starts the Regression
  # workflow on it. Separate job so the write token never coexists with the API key, the AUT or the
  # test run. It re-verifies the patch itself, applies it
  # only to the exact commit that failed, and never merges. The regression job stays failed.
  heal-pr:
    name: Self-heal pull request
    needs: regression
    if: >-
      ${{ always() && needs.regression.outputs.heal_status == 'validated' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # Only to start the Regression workflow on the heal branch: events created with the workflow
      # token never trigger workflows, except workflow_dispatch.
      actions: write
    env:
      HEAL_BRANCH: ${{ needs.regression.outputs.heal_branch }}
      HEAL_HEAD_SHA: ${{ needs.regression.outputs.heal_head_sha }}
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.regression.outputs.heal_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/failure-triage/package-lock.json

      - name: Download self-heal result
        uses: actions/download-artifact@v7
        with:
          name: self-heal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heal

      - name: Verify patch independently
        working-directory: agents/failure-triage
        run: |
          npm ci
          npm run build
          node dist/src/heal/cli.js verify-patch --patch "$RUNNER_TEMP/heal/repair.patch" --result "$RUNNER_TEMP/heal/heal-result.json"

      - name: Open pull request and start CI on it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REVIEWER: ${{ github.repository_owner }}
        run: |
          HEAL_DIR="$RUNNER_TEMP/heal"
          tip=$(git rev-parse HEAD)
          if [ "$tip" != "$HEAL_HEAD_SHA" ]; then
            echo "Branch moved since the failed run ($HEAL_HEAD_SHA -> $tip); not opening a repair PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          file=$(jq -r '.edit.file' "$HEAL_DIR/heal-result.json")
          old=$(jq -r '.edit.oldLocator' "$HEAL_DIR/heal-result.json")
          new=$(jq -r '.edit.newLocator' "$HEAL_DIR/heal-result.json")
          heal_branch="aqa-heal/${RUN_ID}-${RUN_ATTEMPT}"
          git switch -c "$heal_branch"
          git apply --check "$HEAL_DIR/repair.patch"
          git apply "$HEAL_DIR/repair.patch"
          git add -- "$file"
          test "$(git diff --cached --name-only)" = "$file"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test: repair stale locator in $file (self-heal)" -m "$old -> $new"
          git push origin "$heal_branch"
          # Ready for review (not a draft): branch protection (required review + checks) gates the merge.
          url=$(gh pr create --base "$HEAL_BRANCH" --head "$heal_branch" \
            --title "Self-heal: repair stale locator in $file" --body-file "$HEAL_DIR/pr-body.md")
          # Review request is best effort (fails e.g. when the owner is an organization).
          if gh pr edit "$url" --add-reviewer "$REVIEWER" >/dev/null 2>&1; then reviewer="review requested from $REVIEWER"; else reviewer="no reviewer requested"; fi
          # Run the regression suite on the repaired commit; it reports back to the PR as a commit status.
          if gh workflow run regression.yml --ref "$heal_branch"; then ci="Regression workflow started on $heal_branch"; else ci="could not start the Regression workflow; run it manually on $heal_branch"; fi
          {
            echo "## 🩹 Self-heal pull request"
            echo ""
            echo "Opened for human review: $url ($reviewer)."
            echo ""
            echo "CI: $ci."
          } >> "$GITHUB_STEP_SUMMARY"
